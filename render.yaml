services:
  - type: web
    name: careerly-job-tracker-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
